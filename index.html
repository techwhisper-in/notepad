<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Web Notepad Pro</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Roboto+Mono:wght@400;500&family=Playfair+Display&family=Source+Code+Pro&family=Montserrat&family=Open+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4361ee;
      --primary-light: #4895ef;
      --secondary: #3a0ca3;
      --success: #4cc9f0;
      --light-bg: #f8f9fa;
      --light-text: #212529;
      --light-border: #dee2e6;
      --light-menu-bg: #ffffff;
      --dark-bg: #1a1d21;
      --dark-text: #e9ecef;
      --dark-border: #495057;
      --dark-menu-bg: #2d2d39;
      --sepia-bg: #f4ecd8;
      --sepia-text: #5a4a42;
      --sepia-border: #c4b5a0;
      --sepia-menu-bg: #f8f3e6;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      --radius: 8px;
      --transition: all 0.2s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
    }

    body[data-theme='light'] {
      background-color: var(--light-bg);
      color: var(--light-text);
      --menu-bg: var(--light-menu-bg);
      --border-color: var(--light-border);
    }

    body[data-theme='dark'] {
      background-color: var(--dark-bg);
      color: var(--dark-text);
      --menu-bg: var(--dark-menu-bg);
      --border-color: var(--dark-border);
    }

    body[data-theme='sepia'] {
      background-color: var(--sepia-bg);
      color: var(--sepia-text);
      --menu-bg: var(--sepia-menu-bg);
      --border-color: var(--sepia-border);
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      padding: 1rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      margin-bottom: 0.5rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 600;
      font-size: 1.5rem;
    }

    .logo i {
      color: var(--primary);
    }

    .main-content {
      display: flex;
      flex: 1;
      gap: 1.5rem;
      height: calc(100% - 120px);
    }

    .sidebar {
      width: 250px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .sidebar-section {
      background: var(--menu-bg);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--primary);
    }

    .section-title i {
      font-size: 1rem;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 0.8rem;
      border: none;
      border-radius: var(--radius);
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.95rem;
      transition: var(--transition);
      text-align: left;
      color: inherit;
    }

    .btn:hover {
      background: var(--primary-light);
      color: white;
    }

    .btn i {
      width: 18px;
      text-align: center;
    }

    .select-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    select {
      padding: 0.6rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      font-family: inherit;
      background: var(--menu-bg);
      color: inherit;
    }

    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      background: var(--menu-bg);
      border: 1px solid var(--border-color);
    }

    #editor {
      flex: 1;
      padding: 1.5rem;
      resize: none;
      border: none;
      outline: none;
      font-size: 1rem;
      line-height: 1.6;
      font-family: 'Roboto Mono', monospace;
      background: inherit;
      color: inherit;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .format-toolbar {
      display: flex;
      gap: 0.25rem;
      padding: 0.75rem;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      background: var(--menu-bg);
    }

    .format-btn {
      padding: 0.5rem;
      border-radius: 4px;
      border: none;
      background: transparent;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      color: inherit;
    }

    .format-btn:hover {
      background: var(--primary-light);
      color: white;
    }

    .statusbar {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      border-top: 1px solid var(--border-color);
      background: var(--menu-bg);
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-item i {
      color: var(--primary);
    }

    #autosave {
      color: var(--success);
      font-weight: 500;
    }

    .hidden {
      display: none;
    }

    /* Dropdown menu styles */
    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: var(--menu-bg);
      min-width: 200px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      padding: 0.5rem;
      flex-direction: column;
      gap: 0.25rem;
    }

    .dropdown:hover .dropdown-content {
      display: flex;
    }

    .menu-btn {
      padding: 0.6rem 1rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      background: var(--menu-bg);
      color: inherit;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .menu-btn:hover {
      background: var(--primary-light);
      color: white;
    }

    .menu-bar {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    /* Find/Replace Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.4);
    }

    .modal-content {
      background-color: var(--menu-bg);
      margin: 15% auto;
      padding: 1.5rem;
      border: 1px solid var(--border-color);
      width: 400px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .modal-title {
      font-weight: 600;
      font-size: 1.2rem;
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
    }

    .close:hover {
      color: var(--primary);
    }

    .search-input-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .search-input {
      padding: 0.6rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      font-family: inherit;
      background: var(--menu-bg);
      color: inherit;
    }

    .search-options {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .search-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .search-btn {
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: var(--transition);
    }

    .search-btn-primary {
      background: var(--primary);
      color: white;
    }

    .search-btn-primary:hover {
      background: var(--primary-light);
    }

    .search-btn-secondary {
      background: transparent;
      border: 1px solid var(--border-color);
      color: inherit;
    }

    .search-btn-secondary:hover {
      background: var(--border-color);
    }

    /* Print styles */
    @media print {
      body * {
        visibility: hidden;
      }
      #editor, #editor * {
        visibility: visible;
      }
      #editor {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: auto;
        border: none;
        padding: 1in;
        font-size: 12pt;
        line-height: 1.5;
        background: white !important;
        color: black !important;
      }
      .app-container, .editor-container {
        all: unset;
      }
    }

    @media (max-width: 900px) {
      .main-content {
        flex-direction: column;
      }
      
      .sidebar {
        width: 100%;
        flex-direction: row;
        overflow-x: auto;
        padding-bottom: 0.5rem;
      }
      
      .sidebar-section {
        min-width: 200px;
      }
    }

    @media (max-width: 600px) {
      .sidebar {
        flex-direction: column;
      }
      
      .btn-group {
        flex-direction: row;
        flex-wrap: wrap;
      }
      
      .btn {
        flex: 1;
        min-width: 120px;
      }
      
      .format-toolbar {
        justify-content: center;
      }
      
      .statusbar {
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }

      .menu-bar {
        flex-wrap: wrap;
      }

      .modal-content {
        width: 90%;
      }
    }

    .highlight {
      background-color: yellow;
      color: black;
    }
  </style>
</head>
<body data-theme="light">
  <div class="app-container">
    <div class="header">
      <div class="logo">
        <i class="fas fa-file-alt"></i>
        <span>Web Notepad Pro</span>
      </div>
    </div>

    <div class="menu-bar">
      <div class="dropdown">
        <button class="menu-btn"><i class="fas fa-file"></i> File</button>
        <div class="dropdown-content">
          <button class="btn" onclick="newFile()">
            <i class="fas fa-plus"></i>
            <span>New</span>
          </button>
          <input id="openfile" type="file" class="hidden" accept=".txt" onchange="openFile(event)">
          <button class="btn" onclick="document.getElementById('openfile').click()">
            <i class="fas fa-folder-open"></i>
            <span>Open</span>
          </button>
          <button class="btn" onclick="saveFile()">
            <i class="fas fa-save"></i>
            <span>Save</span>
          </button>
          <button class="btn" onclick="saveFileAs()">
            <i class="fas fa-save"></i>
            <span>Save As</span>
          </button>
          <button class="btn" onclick="printDoc()">
            <i class="fas fa-print"></i>
            <span>Print</span>
          </button>
          <button class="btn" onclick="clearEditor()">
            <i class="fas fa-trash"></i>
            <span>Clear</span>
          </button>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn"><i class="fas fa-edit"></i> Edit</button>
        <div class="dropdown-content">
          <button class="btn" onclick="document.execCommand('undo', false)">
            <i class="fas fa-undo"></i>
            <span>Undo</span>
          </button>
          <button class="btn" onclick="document.execCommand('redo', false)">
            <i class="fas fa-redo"></i>
            <span>Redo</span>
          </button>
          <button class="btn" onclick="insertDateTime()">
            <i class="fas fa-clock"></i>
            <span>Date/Time</span>
          </button>
          <button class="btn" onclick="showFindModal()">
            <i class="fas fa-search"></i>
            <span>Find</span>
          </button>
          <button class="btn" onclick="showReplaceModal()">
            <i class="fas fa-exchange-alt"></i>
            <span>Replace</span>
          </button>
          <button class="btn" onclick="cutText()">
            <i class="fas fa-cut"></i>
            <span>Cut</span>
          </button>
          <button class="btn" onclick="copyText()">
            <i class="fas fa-copy"></i>
            <span>Copy</span>
          </button>
          <button class="btn" onclick="pasteText()">
            <i class="fas fa-paste"></i>
            <span>Paste</span>
          </button>
          <button class="btn" onclick="selectAllText()">
            <i class="fas fa-select-all"></i>
            <span>Select All</span>
          </button>
        </div>
      </div>

      <div class="dropdown">
        <button class="menu-btn"><i class="fas fa-palette"></i> Theme</button>
        <div class="dropdown-content">
          <div class="select-group">
            <select id="themechooser" onchange="setTheme(this.value)">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
              <option value="sepia">Sepia</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="editor-container">
        <div class="format-toolbar">
          <button class="format-btn" onclick="zoomIn()" title="Zoom In">
            <i class="fas fa-search-plus"></i>
          </button>
          <button class="format-btn" onclick="zoomOut()" title="Zoom Out">
            <i class="fas fa-search-minus"></i>
          </button>
          <button class="format-btn" onclick="resetZoom()" title="Reset Zoom">
            <i class="fas fa-search"></i>
          </button>
        </div>

        <div id="editor" contenteditable="true" spellcheck="false" oninput="autoSave(); updateStats()"></div>

        <div class="statusbar">
          <div class="status-item">
            <i class="fas fa-file"></i>
            <span id="filename">Untitled.txt</span>
          </div>
          <div class="status-item">
            <i class="fas fa-chart-bar"></i>
            <span id="stats">Words: 0 | Chars: 0 | Lines: 0</span>
          </div>
          <div class="status-item">
            <i class="fas fa-save"></i>
            <span id="autosave">Auto-saved</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Find Modal -->
  <div id="findModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Find</h3>
        <span class="close" onclick="closeFindModal()">&times;</span>
      </div>
      <div class="search-input-group">
        <input type="text" id="findInput" class="search-input" placeholder="Find...">
      </div>
      <div class="search-options">
        <input type="checkbox" id="matchCase">
        <label for="matchCase">Match case</label>
      </div>
      <div class="search-buttons">
        <button class="search-btn search-btn-secondary" onclick="closeFindModal()">Cancel</button>
        <button class="search-btn search-btn-primary" onclick="findText()">Find Next</button>
      </div>
    </div>
  </div>

  <!-- Replace Modal -->
  <div id="replaceModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Replace</h3>
        <span class="close" onclick="closeReplaceModal()">&times;</span>
      </div>
      <div class="search-input-group">
        <input type="text" id="replaceFindInput" class="search-input" placeholder="Find...">
        <input type="text" id="replaceWithInput" class="search-input" placeholder="Replace with...">
      </div>
      <div class="search-options">
        <input type="checkbox" id="replaceMatchCase">
        <label for="replaceMatchCase">Match case</label>
      </div>
      <div class="search-buttons">
        <button class="search-btn search-btn-secondary" onclick="closeReplaceModal()">Cancel</button>
        <button class="search-btn search-btn-primary" onclick="replaceText()">Replace</button>
        <button class="search-btn search-btn-primary" onclick="replaceAllText()">Replace All</button>
      </div>
    </div>
  </div>

  <script>
    let filename = 'Untitled.txt';
    let zoomLevel = 1.0;
    let currentFindIndex = -1;
    let findResults = [];

    function newFile() {
      if(confirm("Create a new document? Unsaved changes will be lost.")) {
        document.getElementById('editor').innerHTML = '';
        filename = 'Untitled.txt';
        document.getElementById('filename').textContent = filename;
        autoSave();
        updateStats();
      }
    }

    function openFile(event) {
      const file = event.target.files[0];
      if(!file) return;
      filename = file.name;
      document.getElementById('filename').textContent = filename;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('editor').innerText = e.target.result;
        updateStats();
        autoSave();
      }
      reader.readAsText(file);
      event.target.value = ''; // Reset input for repeated open
    }

    function saveFile() {
      const blob = new Blob([document.getElementById('editor').innerText], { type: 'text/plain' });
      download(blob, filename);
    }

    function saveFileAs() {
      const name = prompt("Save As filename:", filename);
      if(name) {
        filename = name.endsWith('.txt') ? name : name + '.txt';
        document.getElementById('filename').textContent = filename;
        saveFile();
      }
    }

    function download(blob, name) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }

    function printDoc() {
      const printWindow = window.open('', '_blank');
      const editorContent = document.getElementById('editor').innerText;
      
      printWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>Print Document</title>
          <style>
            body {
              font-family: Arial;
              font-size: 12pt;
              line-height: 1.6;
              padding: 1in;
              color: #000;
              background: #fff;
            }
            @media print {
              body {
                padding: 0;
                margin: 0;
              }
            }
          </style>
        </head>
        <body>
          <pre>${editorContent}</pre>
        </body>
        </html>
      `);
      
      printWindow.document.close();
      
      setTimeout(function() {
        printWindow.focus();
        printWindow.print();
        printWindow.close();
      }, 250);
    }

    function clearEditor() {
      document.getElementById('editor').innerHTML = '';
      updateStats();
      autoSave();
    }

    // Edit actions
    function cutText() { 
      document.execCommand('cut'); 
    }
    
    function copyText() { 
      document.execCommand('copy'); 
    }
    
    function pasteText() { 
      document.getElementById('editor').focus();
      
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(text => {
          document.execCommand('insertText', false, text);
        }).catch(err => {
          document.execCommand('paste');
        });
      } else {
        document.execCommand('paste');
      }
    }
    
    function selectAllText() {
      const editor = document.getElementById('editor');
      const range = document.createRange();
      range.selectNodeContents(editor);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    // Insert Date/Time
    function insertDateTime() {
      const now = new Date();
      const dateTimeStr = now.toLocaleString();
      document.execCommand('insertText', false, dateTimeStr);
    }

    // Zoom
    function zoomIn() { 
      zoomLevel *= 1.1; 
      setZoom(); 
    }
    
    function zoomOut() { 
      zoomLevel /= 1.1; 
      setZoom(); 
    }
    
    function resetZoom() { 
      zoomLevel = 1; 
      setZoom(); 
    }
    
    function setZoom() {
      document.getElementById('editor').style.fontSize = (16 * zoomLevel) + 'px';
    }

    // Find/Replace functionality
    function showFindModal() {
      document.getElementById('findModal').style.display = 'block';
      document.getElementById('findInput').focus();
    }

    function closeFindModal() {
      document.getElementById('findModal').style.display = 'none';
      removeHighlights();
    }

    function showReplaceModal() {
      document.getElementById('replaceModal').style.display = 'block';
      document.getElementById('replaceFindInput').focus();
    }

    function closeReplaceModal() {
      document.getElementById('replaceModal').style.display = 'none';
      removeHighlights();
    }

    function findText() {
      let searchTerm = document.getElementById('findInput').value;
      const matchCase = document.getElementById('matchCase').checked;
      
      if (!searchTerm) return;
      
      const editor = document.getElementById('editor');
      const content = editor.innerText;
      let searchContent = content;
      
      if (!matchCase) {
        searchContent = content.toLowerCase();
        searchTerm = searchTerm.toLowerCase();
      }
      
      // Remove previous highlights
      removeHighlights();
      
      // Find all occurrences
      findResults = [];
      let index = -1;
      
      while ((index = searchContent.indexOf(searchTerm, index + 1)) !== -1) {
        findResults.push(index);
      }
      
      if (findResults.length === 0) {
        alert("No matches found");
        return;
      }
      
      // Move to next result
      currentFindIndex = (currentFindIndex + 1) % findResults.length;
      highlightCurrentFind();
    }

    function highlightCurrentFind() {
      if (currentFindIndex < 0 || currentFindIndex >= findResults.length) return;
      
      const editor = document.getElementById('editor');
      const searchTerm = document.getElementById('findInput').value;
      const startPos = findResults[currentFindIndex];
      const endPos = startPos + searchTerm.length;
      
      // Create range and select the text
      const range = document.createRange();
      range.setStart(editor.firstChild, startPos);
      range.setEnd(editor.firstChild, endPos);
      
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      
      // Scroll to the selection
      editor.focus();
      range.collapse(true);
      const rect = range.getBoundingClientRect();
      window.scrollTo(rect.left, rect.top - 100);
    }

    function removeHighlights() {
      currentFindIndex = -1;
      findResults = [];
      
      const selection = window.getSelection();
      if (selection.rangeCount > 0) {
        selection.removeAllRanges();
      }
    }

    function replaceText() {
      let findTerm = document.getElementById('replaceFindInput').value;
      const replaceTerm = document.getElementById('replaceWithInput').value;
      const matchCase = document.getElementById('replaceMatchCase').checked;
      
      if (!findTerm) return;
      
      const editor = document.getElementById('editor');
      const content = editor.innerText;
      let searchContent = content;
      
      if (!matchCase) {
        searchContent = content.toLowerCase();
        findTerm = findTerm.toLowerCase();
      }
      
      const index = searchContent.indexOf(findTerm);
      
      if (index === -1) {
        alert("No matches found");
        return;
      }
      
      // Create range and select the text
      const range = document.createRange();
      range.setStart(editor.firstChild, index);
      range.setEnd(editor.firstChild, index + findTerm.length);
      
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      
      // Replace the selected text
      document.execCommand('insertText', false, replaceTerm);
      
      updateStats();
      autoSave();
    }

    function replaceAllText() {
      let findTerm = document.getElementById('replaceFindInput').value;
      const replaceTerm = document.getElementById('replaceWithInput').value;
      const matchCase = document.getElementById('replaceMatchCase').checked;
      
      if (!findTerm) return;
      
      const editor = document.getElementById('editor');
      let content = editor.innerText;
      
      if (matchCase) {
        // Case sensitive replacement
        const regex = new RegExp(escapeRegExp(findTerm), 'g');
        content = content.replace(regex, replaceTerm);
      } else {
        // Case insensitive replacement
        const regex = new RegExp(escapeRegExp(findTerm), 'gi');
        content = content.replace(regex, replaceTerm);
      }
      
      editor.innerText = content;
      updateStats();
      autoSave();
      closeReplaceModal();
    }

    // Helper function to escape special regex characters
    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // Auto-save/Load
    function autoSave() {
      const content = document.getElementById('editor').innerText;
      const settings = {
        filename: filename,
        content: content,
        theme: document.body.getAttribute('data-theme'),
        zoom: zoomLevel
      };
      localStorage.setItem('webnotepad_autosave', JSON.stringify(settings));
      document.getElementById('autosave').textContent = "Auto-saved";
    }
    
    function autoLoad() {
      const save = localStorage.getItem('webnotepad_autosave');
      if(save) {
        const s = JSON.parse(save);
        filename = s.filename || 'Untitled.txt';
        document.getElementById('filename').textContent = filename;
        document.getElementById('editor').innerText = s.content || '';
        document.body.setAttribute('data-theme', s.theme || 'light');
        document.getElementById('themechooser').value = s.theme || 'light';
        zoomLevel = s.zoom || 1;
        setZoom();
      }
      setTimeout(updateStats, 150);
    }
    
    window.onload = autoLoad;
    setInterval(autoSave, 6000);

    // Statistics
    function updateStats() {
      const text = document.getElementById('editor').innerText;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      const chars = text.length;
      const lines = text ? text.split('\n').length : 0;
      document.getElementById('stats').textContent = `Words: ${words} | Chars: ${chars} | Lines: ${lines}`;
    }
    
    document.getElementById('editor').addEventListener('input', updateStats);

    // Theme
    function setTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      autoSave();
    }
    
    // Close modals when clicking outside
    window.onclick = function(event) {
      const findModal = document.getElementById('findModal');
      const replaceModal = document.getElementById('replaceModal');
      
      if (event.target == findModal) {
        closeFindModal();
      }
      if (event.target == replaceModal) {
        closeReplaceModal();
      }
    }
    
    // Keyboard Shortcuts
    document.addEventListener('keydown', function(e) {
      if(e.ctrlKey || e.metaKey) {
        if(e.key === 's') { e.preventDefault(); saveFile(); }
        if(e.key === 'o') { e.preventDefault(); document.getElementById('openfile').click(); }
        if(e.key === 'n') { e.preventDefault(); newFile(); }
        if(e.key === 'a') { selectAllText(); }
        if(e.key === 'f') { e.preventDefault(); showFindModal(); }
        if(e.key === 'h') { e.preventDefault(); showReplaceModal(); }
        if(e.key === 'z' && !e.shiftKey) { e.preventDefault(); document.execCommand('undo', false); }
        if(e.key === 'z' && e.shiftKey) { e.preventDefault(); document.execCommand('redo', false); }
      }
    });
  </script>
</body>
</html>
